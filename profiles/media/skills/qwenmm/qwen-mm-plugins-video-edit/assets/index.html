/* ---------- 通用：live 演示卡渲染 ---------- */
function mountDemos(container, defs, extraMeta) {
  const html = defs.map(d => `<div class="card" data-k="${esc(d.name + (d.en||'') + d.meta)}" id="c-${d.id}">
    <div class="stage${d.light ? ' light' : ''}"><div class="fx">${d.html}</div></div>
    <div class="meta"><h3>${esc(d.name)}${d.en ? `<span class="en">${esc(d.en)}</span>` : ''}</h3>
      <p>${esc(d.meta)}</p>
      <div class="ctrl"><button class="rp">▶ 重播</button>
        <input type="range" min="0" max="1000" value="0" title="拖动 = seek，验证确定性"></div>
    </div></div>`).join('');
  container.insertAdjacentHTML('beforeend', `<div class="grid">${html}</div>`);
  defs.forEach(d => {
    const card = document.getElementById('c-' + d.id);
    const st = document.createElement('style');
    st.textContent = d.css.replaceAll('%%', '#c-' + d.id);
    document.head.appendChild(st);
    const fx = card.querySelector('.fx');
    const tl = gsap.timeline({ paused: true });
    try { d.build(fx, tl); } catch (e) {
      card.querySelector('h3').innerHTML += ' <span style="color:#ff4d6d">BUILD FAIL</span>';
      console.error(d.id, e); }
    const sl = card.querySelector('input[type=range]');
    tl.eventCallback('onUpdate', () => sl.value = tl.progress() * 1000);
    sl.addEventListener('input', () => { tl.pause(); tl.progress(sl.value / 1000); });
    card.querySelector('.rp').onclick = () => tl.restart();
    new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { tl.play(); ob.disconnect(); } },
      { threshold: 0.35 }).observe(card);
  });
}
function searchBar(placeholder, extra = '') {
  return `<div class="bar"><input class="q" placeholder="${placeholder}">${extra}</div>`;
}
function bindSearch(scope) {
  const q = scope.querySelector('.q');
  if (q) q.addEventListener('input', e => {
    const v = e.target.value.trim().toLowerCase();
    scope.querySelectorAll('.card').forEach(c =>
      c.style.display = (c.dataset.k || '').toLowerCase().includes(v) ? '' : 'none');
  });
}

/* ---------- Tab 1：动效配方 ---------- */
function tabMotion(m) {
  m.innerHTML = searchBar('按名称/参数/用途过滤…') +
    `<p class="src">源：<code>craft/motion-recipes.md</code> · 代码：<code>craft/snippets/</code> ·
     28 approved（下方 live 播放，拖滑杆验证 seek 确定性）+ 11 rejected 黑名单</p>`;
  const groups = [...new Set(window.MOTION_DEMOS.map(d => d.g))];
  groups.forEach(g => {
    const defs = window.MOTION_DEMOS.filter(d => d.g === g);
    m.insertAdjacentHTML('beforeend', `<h2 class="grp">${esc(g)}<small>${defs.length} 个</small></h2>`);
    mountDemos(m, defs);
  });
  m.insertAdjacentHTML('beforeend', `<h2 class="grp">Rejected 黑名单<small>实审毙掉 · 仅用户点名（防复活）</small></h2>
    <div class="grid sm rej">${REJECTED_RECIPES.map(n =>
      `<div class="card" data-k="${esc(n)}"><div class="meta"><h3>${esc(n)}</h3></div></div>`).join('')}</div>`);
  bindSearch(m);
}

/* ---------- Tab 2：转场 ---------- */
function tabTransitions(m) {
  m.innerHTML = searchBar('按名称/register 过滤…') +
    `<p class="src">源：<code>craft/transitions.md</code> · A/B 双镜 live 演示 ·
     硬规则：硬切是脊柱 · 一片一个家族 · motivated 优于 decorative · [no-zoom-drift] 必须落回 1.0</p>`;
  const keep = window.TRANSITION_DEMOS.filter(d => d.keep);
  const bench = window.TRANSITION_DEMOS.filter(d => !d.keep);
  m.insertAdjacentHTML('beforeend', `<h2 class="grp">保留菜单<small>${keep.length} 个 · 默认从这里提案</small></h2>`);
  mountDemos(m, keep);
  m.insertAdjacentHTML('beforeend', `<h2 class="grp">冷板凳<small>${bench.length} 个 · 实审弃用，仅用户点名</small></h2>`);
  const holder = document.createElement('div'); holder.className = 'rej';
  m.appendChild(holder); mountDemos(holder, bench);
  bindSearch(m);
}

    <table class="pair"><tr><th>片型</th><th>Latin 配对</th><th>中文搭配</th></tr>
    ${GENRE_PAIR.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>
    <p class="src" style="margin-top:10px">配对法则：每片 ≤2 个字族（+1 mono 可豁免）· 对比字重与字宽，别用两个相似 sans · 全片字幕统一一个家族</p>`);
  document.getElementById('gf').onclick = function () {
    const els = [...m.querySelectorAll('[data-gf]')];
    const fams = [...new Set(els.map(e => e.dataset.gf))];
    for (let i = 0; i < fams.length; i += 8) {
      const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?' + fams.slice(i, i + 8).map(f => 'family=' + f).join('&') + '&display=swap';
      document.head.appendChild(l);
    }
    els.forEach(el => {
      const fam = el.dataset.gf.split(':')[0].replaceAll('+', ' ');
      const zh = el.dataset.zh === '1';
      el.querySelector('.fspec').outerHTML = `<div class="fspec" style="font-family:'${fam}'">
        <div class="lat">Aa Qq — quick fox</div>
        ${zh ? '<div class="zh">山谷里的一餐 视频剪辑</div>'
             : '<div class="zh" style="font-size:14px;color:#9a9aa5">0123456789 · ¥18</div>'}</div>`;
    });
    this.textContent = '已加载（网络慢时稍等）'; this.disabled = true;
  };
  bindSearch(m);
}

/* ---------- Tab 引擎 ---------- */
const TABS = [
  ['动效配方', window.MOTION_DEMOS.length + '+11', tabMotion],
  ['转场', window.TRANSITION_DEMOS.length, tabTransitions],
  ['Looks 风格卡', LOOKS.length, tabLooks],
  ['字体库', Object.values(FONTS).flat().length, tabFonts],
];
const nav = document.getElementById('nav'), main = document.getElementById('main');
TABS.forEach(([label, count], i) => {
  const b = document.createElement('button');
  b.innerHTML = `${label}<b>${count}</b>`;
  b.onclick = () => {
    [...nav.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    main.innerHTML = ''; window.scrollTo(0, 0);
    gsap.globalTimeline.clear();          // 切页时停掉上一页的 timeline
    TABS[i][2](main);
    location.hash = 'tab' + i;
  };
  nav.appendChild(b);
});
const start = Math.max(0, Math.min(TABS.length - 1, parseInt((location.hash.match(/tab(\d)/) || [])[1] ?? 0)));
nav.children[start].click();
</script>
