<!--
  K12 Asset: 弹簧波（纵波）
  ID: spring-wave
  Suitable: 纵波, 声波传播, 疏密波, 弹性介质, 波速
  CSS Vars: --wave-phase (0-6.28), --compression (0-1, intensity of density variation)
  JS Hooks: wave-phase for propagation; compression modulates coil spacing
  Size: 200×30px at 1920×1080

  Variants: (single style — metallic spring coils)
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .spring-wave {
    position: absolute;
    width: 200px;
    height: 30px;
    margin-left: -100px;
    transform-origin: 50% 50%;
    z-index: 12;
    --wave-phase: 0;
    --compression: 0.6;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
  }

  /* Ground shadow */
  .spring-wave::after {
    content: "";
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: -8px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.3), transparent 70%);
    z-index: -1;
  }

  /* End cap left — fixed wall */
  .spring-wave-cap-l {
    position: absolute;
    left: 0;
    top: 4px;
    width: 6px;
    height: 22px;
    border-radius: 2px;
    background:
      linear-gradient(90deg, rgba(148,163,184,0.6), rgba(203,213,225,0.8) 50%, rgba(148,163,184,0.6)),
      linear-gradient(180deg, rgba(234,234,234,0.2), transparent 30%, transparent 70%, rgba(0,0,0,0.1));
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.2),
      inset 0 -2px 3px rgba(0,0,0,0.2),
      1px 0 3px rgba(0,0,0,0.15);
  }

  /* End cap right — fixed wall */
  .spring-wave-cap-r {
    position: absolute;
    right: 0;
    top: 4px;
    width: 6px;
    height: 22px;
    border-radius: 2px;
    background:
      linear-gradient(90deg, rgba(148,163,184,0.6), rgba(203,213,225,0.8) 50%, rgba(148,163,184,0.6)),
      linear-gradient(180deg, rgba(234,234,234,0.2), transparent 30%, transparent 70%, rgba(0,0,0,0.1));
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.2),
      inset 0 -2px 3px rgba(0,0,0,0.2),
      -1px 0 3px rgba(0,0,0,0.15);
  }

  /* Coils container */
  .spring-wave-coils {
    position: absolute;
    left: 8px;
    top: 0;
    width: 184px;
    height: 30px;
  }

  /* Individual coil — vertical line segment */
  .spring-wave-coil {
    position: absolute;
    top: 4px;
    width: 3px;
    height: 22px;
    border-radius: 1.5px;
    background:
      linear-gradient(90deg, rgba(100,116,139,0.7), rgba(203,213,225,0.9) 40%, rgba(148,163,184,0.8) 70%, rgba(100,116,139,0.6)),
      linear-gradient(180deg, rgba(234,234,234,0.25), transparent 30%, transparent 70%, rgba(0,0,0,0.1));
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.3),
      inset 0 -1px 2px rgba(0,0,0,0.2),
      1px 0 2px rgba(0,0,0,0.1),
      -1px 0 2px rgba(0,0,0,0.05);
  }

  /* Coil connecting wire — top */
  .spring-wave-wire-top {
    position: absolute;
    left: 8px;
    top: 6px;
    width: 184px;
    height: 2px;
    background: linear-gradient(90deg, rgba(148,163,184,0.4), rgba(203,213,225,0.5) 50%, rgba(148,163,184,0.4));
    border-radius: 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
  }

  /* Coil connecting wire — bottom */
  .spring-wave-wire-bot {
    position: absolute;
    left: 8px;
    bottom: 6px;
    width: 184px;
    height: 2px;
    background: linear-gradient(90deg, rgba(148,163,184,0.4), rgba(203,213,225,0.5) 50%, rgba(148,163,184,0.4));
    border-radius: 1px;
    box-shadow: 0 -1px 1px rgba(0,0,0,0.1);
  }

  /* Direction arrow indicator */
  .spring-wave-arrow {
    position: absolute;
    left: 85px;
    top: -8px;
    width: 30px;
    height: 6px;
    background: linear-gradient(90deg, transparent, rgba(251,191,36,0.6) 30%, rgba(251,191,36,0.7));
    clip-path: polygon(0% 20%, 80% 20%, 80% 0%, 100% 50%, 80% 100%, 80% 80%, 0% 80%);
  }
</style>

<!-- ===== JS HOOKS (paste into renderAt): =====
  // Position coils with longitudinal wave density variation
  var phase = parseFloat(getComputedStyle(springEl).getPropertyValue("--wave-phase")) || 0;
  var compression = parseFloat(getComputedStyle(springEl).getPropertyValue("--compression")) || 0.6;
  var coils = springEl.querySelectorAll(".spring-wave-coil");
  var numCoils = coils.length;
  var totalWidth = 184;
  var baseSpacing = totalWidth / (numCoils + 1);

  for (var i = 0; i < numCoils; i++) {
    // Each coil's displacement from equilibrium position
    var equilibriumX = (i + 1) * baseSpacing;
    // Longitudinal displacement: dx = A * sin(kx - wt)
    var normalizedPos = i / numCoils;
    var displacement = compression * baseSpacing * 0.5 * Math.sin(normalizedPos * 2 * Math.PI * 2 + phase);
    var x = equilibriumX + displacement;
    coils[i].style.left = x + "px";

    // Density-based opacity: denser = more opaque
    // Density relates to -d(displacement)/dx
    var densityFactor = 1 + compression * 0.4 * Math.cos(normalizedPos * 2 * Math.PI * 2 + phase);
    coils[i].style.opacity = 0.5 + densityFactor * 0.3;
    // Width varies slightly with density
    coils[i].style.width = (2 + densityFactor * 1.2) + "px";
  }
-->
