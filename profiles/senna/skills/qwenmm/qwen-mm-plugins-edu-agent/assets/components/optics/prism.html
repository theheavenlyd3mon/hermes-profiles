<!--
  K12 Asset: 三棱镜
  ID: prism
  Suitable: 光的折射, 光的色散, 全反射, 棱镜偏向角
  CSS Vars: --refraction-glow (0-1 for rainbow dispersion effect intensity)
  JS Hooks: set --refraction-glow for rainbow edge; animate shimmer via Math.sin
  Size: 50×44px at 1920×1080
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .prism {
    position: absolute;
    width: 50px;
    height: 44px;
    margin-left: -25px;
    transform-origin: 50% 100%;
    --refraction-glow: 0;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35));
  }

  /* Ground shadow */
  .prism::after {
    content: "";
    position: absolute;
    left: -4px;
    bottom: -8px;
    width: 58px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.34), transparent 68%);
  }

  /* Glass body — equilateral triangle via clip-path */
  .prism-body {
    position: absolute;
    left: 0;
    top: 0;
    width: 50px;
    height: 44px;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background:
      linear-gradient(135deg, rgba(234,234,234,0.2) 0%, rgba(200,220,250,0.08) 30%, transparent 60%),
      linear-gradient(240deg, rgba(234,234,234,0.1) 0%, rgba(180,210,250,0.06) 40%, transparent 70%),
      radial-gradient(ellipse at 50% 60%, rgba(180,210,250,0.16), rgba(140,180,240,0.08) 50%, transparent 80%),
      linear-gradient(180deg, rgba(160,200,255,0.2), rgba(120,170,240,0.14) 40%, rgba(100,150,230,0.18) 80%, rgba(140,180,240,0.12));
    box-shadow:
      inset 0 -6px 10px rgba(0,0,0,0.08),
      inset 2px 2px 6px rgba(255,255,255,0.08),
      inset -2px 2px 6px rgba(255,255,255,0.05);
  }

  /* Glass left face highlight */
  .prism-highlight-left {
    position: absolute;
    left: 4px;
    top: 8px;
    width: 2px;
    height: 28px;
    transform: rotate(30deg);
    transform-origin: 50% 100%;
    border-radius: 999px;
    background: linear-gradient(180deg,
      rgba(234,234,234,0.35),
      rgba(234,234,234,0.1) 60%,
      transparent 90%);
  }

  /* Glass right face subtle highlight */
  .prism-highlight-right {
    position: absolute;
    right: 8px;
    top: 14px;
    width: 1.5px;
    height: 22px;
    transform: rotate(-30deg);
    transform-origin: 50% 100%;
    border-radius: 999px;
    background: linear-gradient(180deg,
      transparent 10%,
      rgba(234,234,234,0.15) 50%,
      rgba(234,234,234,0.05) 90%);
  }

  /* Glass internal refraction caustic */
  .prism-caustic {
    position: absolute;
    left: 0;
    top: 0;
    width: 50px;
    height: 44px;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background:
      radial-gradient(ellipse at 40% 55%, rgba(234,234,234,0.06), transparent 40%),
      radial-gradient(ellipse at 60% 65%, rgba(200,220,255,0.05), transparent 35%);
    pointer-events: none;
  }

  /* Edge borders — three sides of the triangle */
  .prism-edge {
    position: absolute;
    background: rgba(180,210,240,0.3);
  }

  /* Bottom edge */
  .prism-edge-bottom {
    left: 0;
    bottom: 0;
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(180,210,240,0.15),
      rgba(180,210,240,0.35) 50%,
      rgba(180,210,240,0.15));
  }

  /* Left edge — top vertex (25,0) → bottom-left (0,44) */
  .prism-edge-left {
    left: 25px;
    top: 0;
    width: 51px;
    height: 1px;
    transform-origin: 0% 0%;
    transform: rotate(120deg);
    background: linear-gradient(90deg,
      rgba(200,225,250,0.35),
      rgba(180,210,240,0.2));
  }

  /* Right edge — top vertex (25,0) → bottom-right (50,44) */
  .prism-edge-right {
    left: 25px;
    top: 0;
    width: 51px;
    height: 1px;
    transform-origin: 0% 0%;
    transform: rotate(60deg);
    background: linear-gradient(90deg,
      rgba(180,210,240,0.18),
      rgba(200,225,250,0.28));
  }

  /* Rainbow dispersion — visible when --refraction-glow > 0 */
  .prism-rainbow {
    position: absolute;
    right: -30px;
    top: 12px;
    width: 32px;
    height: 28px;
    transform: rotate(-15deg);
    opacity: var(--refraction-glow);
    overflow: visible;
    pointer-events: none;
  }

  /* Individual spectral bands */
  .prism-spectrum {
    position: absolute;
    left: 0;
    height: 2.5px;
    border-radius: 1px;
    filter: blur(0.3px);
  }

  .prism-spectrum:nth-child(1) {
    top: 0;
    width: 28px;
    background: linear-gradient(90deg, rgba(255,0,0,0.7), rgba(255,0,0,0.1));
    box-shadow: 0 0 4px rgba(255,0,0,0.3);
  }
  .prism-spectrum:nth-child(2) {
    top: 4px;
    width: 26px;
    background: linear-gradient(90deg, rgba(255,150,0,0.7), rgba(255,150,0,0.1));
    box-shadow: 0 0 4px rgba(255,150,0,0.3);
  }
  .prism-spectrum:nth-child(3) {
    top: 8px;
    width: 24px;
    background: linear-gradient(90deg, rgba(255,255,0,0.7), rgba(255,255,0,0.1));
    box-shadow: 0 0 4px rgba(255,255,0,0.3);
  }
  .prism-spectrum:nth-child(4) {
    top: 12px;
    width: 22px;
    background: linear-gradient(90deg, rgba(0,200,0,0.7), rgba(0,200,0,0.1));
    box-shadow: 0 0 4px rgba(0,200,0,0.3);
  }
  .prism-spectrum:nth-child(5) {
    top: 16px;
    width: 24px;
    background: linear-gradient(90deg, rgba(0,100,255,0.7), rgba(0,100,255,0.1));
    box-shadow: 0 0 4px rgba(0,100,255,0.3);
  }
  .prism-spectrum:nth-child(6) {
    top: 20px;
    width: 26px;
    background: linear-gradient(90deg, rgba(75,0,130,0.7), rgba(75,0,130,0.1));
    box-shadow: 0 0 4px rgba(75,0,130,0.3);
  }
  .prism-spectrum:nth-child(7) {
    top: 24px;
    width: 28px;
    background: linear-gradient(90deg, rgba(128,0,255,0.7), rgba(128,0,255,0.1));
    box-shadow: 0 0 4px rgba(128,0,255,0.3);
  }

  /* Rainbow ambient glow */
  .prism-rainbow::before {
    content: "";
    position: absolute;
    left: -4px;
    top: -4px;
    width: 40px;
    height: 36px;
    border-radius: 4px;
    background: radial-gradient(ellipse at 30% 50%,
      rgba(255,200,100,0.08),
      transparent 60%);
  }
</style>

<!-- ===== HTML: paste into world panel ===== -->
<div id="prism" class="prism">
  <div class="prism-body"></div>
  <div class="prism-caustic"></div>
  <div class="prism-highlight-left"></div>
  <div class="prism-highlight-right"></div>
  <div class="prism-edge prism-edge-bottom"></div>
  <div class="prism-edge prism-edge-left"></div>
  <div class="prism-edge prism-edge-right"></div>
  <div class="prism-rainbow">
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
    <div class="prism-spectrum"></div>
  </div>
</div>

<!-- ===== JS HOOKS (paste into renderAt): =====
  // Set refraction/dispersion glow (0 = off, 1 = full rainbow)
  prism.style.setProperty("--refraction-glow", 1);

  // Animated rainbow shimmer
  var shimmer = 0.8 + Math.sin(time * 2.8) * 0.2;
  prism.style.setProperty("--refraction-glow", shimmer);
