  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    var SCENE_DURATION = 15.58;
    var R = function(d){ return Math.max(0, Math.ceil(SCENE_DURATION / d) - 1); };
    var tl = gsap.timeline({ paused:true });
    try {
      tl.fromTo("#mt-anaphase .scene-content", {autoAlpha:0}, {autoAlpha:1,duration:0.35,ease:"power2.out"}, 0);
      tl.fromTo("#mt-anaphase .glass-panel", {y:50,autoAlpha:0}, {y:0,autoAlpha:1,duration:0.8,ease:"power3.out"}, 0.15);
      tl.fromTo("#mt-anaphase .numchip", {scale:0.7,autoAlpha:0}, {scale:1,autoAlpha:1,duration:0.5,ease:"back.out(1.6)"}, 0.6);
      // show replicated, hide singles initially
      tl.set("#mt-anaphase-u0",{autoAlpha:0}); tl.set("#mt-anaphase-d0",{autoAlpha:0});
      tl.fromTo("#mt-anaphase-c0", {autoAlpha:0}, {autoAlpha:1,duration:0.4}, 0.70);
      tl.set("#mt-anaphase-u1",{autoAlpha:0}); tl.set("#mt-anaphase-d1",{autoAlpha:0});
      tl.fromTo("#mt-anaphase-c1", {autoAlpha:0}, {autoAlpha:1,duration:0.4}, 0.80);
      tl.set("#mt-anaphase-u2",{autoAlpha:0}); tl.set("#mt-anaphase-d2",{autoAlpha:0});

      tl.set("#mt-anaphase-u3",{autoAlpha:0}); tl.set("#mt-anaphase-d3",{autoAlpha:0});
      tl.fromTo("#mt-anaphase-c3", {autoAlpha:0}, {autoAlpha:1,duration:0.4}, 1.00);

      tl.to("#mt-anaphase-c0-in", {scale:1.25,duration:0.28,ease:"sine.inOut",yoyo:true,repeat:1}, 3.00);
      tl.to("#mt-anaphase-c1-in", {scale:1.25,duration:0.28,ease:"sine.inOut",yoyo:true,repeat:1}, 3.00);
      tl.to("#mt-anaphase-c2-in", {scale:1.25,duration:0.28,ease:"sine.inOut",yoyo:true,repeat:1}, 3.00);
      tl.to("#mt-anaphase-c3-in", {scale:1.25,duration:0.28,ease:"sine.inOut",yoyo:true,repeat:1}, 3.00);
      tl.to("#mt-anaphase-c0", {autoAlpha:0,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-u0", {autoAlpha:1,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-d0", {autoAlpha:1,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-u0", {attr:{transform:"translate(400,130) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-d0", {attr:{transform:"translate(400,430) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-c1", {autoAlpha:0,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-u1", {autoAlpha:1,duration:0.2}, 3.6);

      tl.to("#mt-anaphase-u1", {attr:{transform:"translate(470,130) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-d1", {attr:{transform:"translate(470,430) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-c2", {autoAlpha:0,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-u2", {autoAlpha:1,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-d2", {autoAlpha:1,duration:0.2}, 3.6);
      tl.to("#mt-anaphase-u2", {attr:{transform:"translate(540,130) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-d2", {attr:{transform:"translate(540,430) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      tl.to("#mt-anaphase-c3", {autoAlpha:0,duration:0.2}, 3.6);

      tl.to("#mt-anaphase-d3", {autoAlpha:1,duration:0.2}, 3.6);

      tl.to("#mt-anaphase-d3", {attr:{transform:"translate(610,430) rotate(0)"},duration:1.6,ease:"power2.inOut"}, 3.7);
      // 纺锤丝随姐妹染色单体移向两极而缩短牵引（与染色单体移动同步）

      tl.to("#mt-anaphase .numchip", {scale:1.0,duration:0.4}, 5.5);
      if(document.querySelector("#mt-anaphase-f0")) tl.fromTo("#mt-anaphase-f0", {x:30,autoAlpha:0}, {x:0,autoAlpha:1,duration:0.5,ease:"power2.out"}, 1.40);
      if(document.querySelector("#mt-anaphase-f1")) tl.fromTo("#mt-anaphase-f1", {x:30,autoAlpha:0}, {x:0,autoAlpha:1,duration:0.5,ease:"power2.out"}, 1.95);
      if(document.querySelector("#mt-anaphase-f2")) tl.fromTo("#mt-anaphase-f2", {x:30,autoAlpha:0}, {x:0,autoAlpha:1,duration:0.5,ease:"power2.out"}, 2.50);

    } catch(e) { console.error("timeline err mt-anaphase", e); }

  try{
    tl.fromTo("#mt-anaphase .a1", {x:0,y:0}, {x:-42,y:28,duration:4,ease:"sine.inOut",yoyo:true,repeat:R(4)}, 0);
    tl.fromTo("#mt-anaphase .a2", {x:0,y:0}, {x:32,y:-22,duration:3.5,ease:"sine.inOut",yoyo:true,repeat:R(3.5)}, 0.4);

  }catch(e){}
    window.__timelines["mt-anaphase"] = tl;
  })();
  </script>
