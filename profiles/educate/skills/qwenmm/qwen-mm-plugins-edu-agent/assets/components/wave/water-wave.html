<!--
  K12 Asset: 水波纹（俯视同心圆）
  ID: water-wave
  Suitable: 波的传播, 波源, 频率, 波长, 干涉, 衍射
  CSS Vars: --wave-count (number of rings), --wave-phase (0-6.28), --wave-color (ring color)
  JS Hooks: wave-phase increments for expanding rings; opacity fades with distance
  Size: 120×120px at 1920×1080

  Variants: (single style — blue water ripples on dark surface)
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .water-wave {
    position: absolute;
    width: 120px;
    height: 120px;
    margin-left: -60px;
    transform-origin: 50% 50%;
    z-index: 12;
    --wave-count: 5;
    --wave-phase: 0;
    --wave-color: rgba(56,189,248,0.7);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.25));
  }

  /* Subtle ground plane / water surface background */
  .water-wave::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(8,47,73,0.4) 0%, rgba(8,47,73,0.2) 40%, transparent 70%);
    z-index: -1;
  }

  /* Water surface base — dark pool */
  .water-wave-surface {
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 45% 42%, rgba(56,189,248,0.08) 0%, transparent 30%),
      radial-gradient(circle, rgba(15,23,42,0.6) 0%, rgba(8,47,73,0.4) 50%, transparent 72%);
  }

  /* Concentric wave rings — generated via multiple box-shadows on a single element */
  .water-wave-rings {
    position: absolute;
    left: 57px;
    top: 57px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }

  /* Ring 1 */
  .water-wave-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    border: 1.5px solid rgba(56,189,248,0.7);
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 4px rgba(56,189,248,0.3),
      inset 0 0 2px rgba(56,189,248,0.15);
  }

  .water-wave-ring:nth-child(1) {
    width: 20px;
    height: 20px;
    border-color: rgba(56,189,248,0.8);
  }
  .water-wave-ring:nth-child(2) {
    width: 40px;
    height: 40px;
    border-color: rgba(56,189,248,0.65);
  }
  .water-wave-ring:nth-child(3) {
    width: 60px;
    height: 60px;
    border-color: rgba(56,189,248,0.5);
  }
  .water-wave-ring:nth-child(4) {
    width: 80px;
    height: 80px;
    border-color: rgba(56,189,248,0.35);
  }
  .water-wave-ring:nth-child(5) {
    width: 100px;
    height: 100px;
    border-color: rgba(56,189,248,0.2);
  }

  /* Source point — center dot */
  .water-wave-source {
    position: absolute;
    left: 55px;
    top: 55px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 35%, rgba(234,234,234,0.7) 0 2px, transparent 4px),
      radial-gradient(circle, rgba(56,189,248,0.9), rgba(14,116,144,0.95));
    box-shadow:
      inset 1px 1px 3px rgba(255,255,255,0.3),
      inset -1px -1px 2px rgba(0,0,0,0.2),
      0 0 8px rgba(56,189,248,0.5),
      0 0 16px rgba(56,189,248,0.2);
  }

  /* Source pulse glow */
  .water-wave-source::after {
    content: "";
    position: absolute;
    left: -4px;
    top: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.3), transparent 70%);
  }
</style>

<!-- ===== HTML: paste into world panel ===== -->
<div id="waterWave" class="water-wave">
  <div class="water-wave-surface"></div>
  <div class="water-wave-rings">
    <div class="water-wave-ring"></div>
    <div class="water-wave-ring"></div>
    <div class="water-wave-ring"></div>
    <div class="water-wave-ring"></div>
    <div class="water-wave-ring"></div>
  </div>
  <div class="water-wave-source"></div>
</div>
