<!--
  K12 Asset: 试管
  ID: test-tube
  Suitable: 化学反应, 溶解, 加热, 沉淀, 气体收集, 液体混合
  CSS Vars:
    --fill (0=empty, 1=full, controls liquid level)
    --liquid-color (default: rgba(96,165,250,0.45))
    --tilt (angle in deg for tilting, default: 0)
  JS Hooks: set --fill for liquid level, --tilt for tilting angle
  Size: 16×80px at 1920×1080

  Note: Narrow glass tube with rounded bottom. Optional .tube-clamped class adds holder clip.
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .test-tube {
    position: absolute;
    width: 16px;
    height: 80px;
    margin-left: -8px;
    transform-origin: 50% 12px;
    --fill: 0.5;
    --liquid-color: rgba(96,165,250,0.45);
    --tilt: 0;
    transform: rotate(calc(var(--tilt) * 1deg));
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.32));
  }

  /* Ground shadow */
  .test-tube::after {
    content: "";
    position: absolute;
    left: -6px; right: -6px; bottom: -8px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.32), transparent 68%);
  }

  /* Glass tube body */
  .tt-body {
    position: absolute;
    left: 1px; top: 6px;
    width: 14px; height: 72px;
    border-radius: 2px 2px 7px 7px;
    background:
      linear-gradient(90deg, rgba(234,234,234,0.2) 0%, transparent 25%, transparent 75%, rgba(234,234,234,0.06)),
      linear-gradient(180deg, rgba(200,220,255,0.1), rgba(180,210,250,0.06) 50%, rgba(160,200,240,0.08)),
      radial-gradient(ellipse at 25% 20%, rgba(234,234,234,0.12), transparent 45%),
      linear-gradient(90deg, rgba(140,180,230,0.12), rgba(120,160,220,0.07) 50%, rgba(140,180,230,0.09));
    border: 1.2px solid rgba(180,210,240,0.28);
    border-top: none;
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,0.05),
      inset 1px 0 3px rgba(255,255,255,0.06),
      inset -1px 0 3px rgba(255,255,255,0.04),
      0 0 4px rgba(140,180,230,0.08);
    overflow: hidden;
  }

  /* Glass highlight stripe — vertical reflection on left */
  .tt-body::before {
    content: "";
    position: absolute;
    left: 1px; top: 2px;
    width: 1.5px; height: 64px;
    border-radius: 999px;
    background: linear-gradient(180deg,
      rgba(234,234,234,0.35),
      rgba(234,234,234,0.14) 50%,
      transparent 85%);
  }

  /* Glass bottom thickness — rounded bottom interior */
  .tt-body::after {
    content: "";
    position: absolute;
    left: 1px; right: 1px; bottom: 0;
    height: 8px;
    border-radius: 0 0 6px 6px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(180,210,240,0.12), transparent 70%),
      linear-gradient(180deg, transparent, rgba(140,180,220,0.08));
  }

  /* Rim — top edge of tube */
  .tt-rim {
    position: absolute;
    left: 0; top: 3px;
    width: 16px; height: 4px;
    border-radius: 2px;
    background:
      linear-gradient(180deg, rgba(200,220,240,0.28), rgba(160,190,230,0.15));
    border: 0.8px solid rgba(180,210,240,0.22);
    box-shadow:
      inset 0 1px rgba(255,255,255,0.12),
      0 1px 2px rgba(0,0,0,0.08);
  }

  /* Liquid body — fills from rounded bottom */
  .tt-liquid {
    position: absolute;
    left: 1px; right: 1px;
    bottom: 1px;
    height: calc(var(--fill) * 64px);
    max-height: 64px;
    border-radius: 0 0 6px 6px;
    background:
      linear-gradient(180deg, transparent, rgba(0,0,0,0.06) 90%),
      radial-gradient(ellipse at 35% 15%, rgba(234,234,234,0.12), transparent 50%),
      linear-gradient(180deg, var(--liquid-color), var(--liquid-color));
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.08),
      inset 0 -3px 5px rgba(0,0,0,0.08);
  }

  /* Liquid meniscus — concave surface at top */
  .tt-liquid::before {
    content: "";
    position: absolute;
    left: -1px; right: -1px; top: -2px;
    height: 4px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 50% 50%,
        rgba(234,234,234,0.22), transparent 60%),
      linear-gradient(180deg, rgba(234,234,234,0.1), transparent);
  }

  /* Liquid internal caustic */
  .tt-liquid::after {
    content: "";
    position: absolute;
    left: 2px; right: 2px; bottom: 2px;
    height: 35%;
    background:
      radial-gradient(ellipse at 45% 60%, rgba(234,234,234,0.06), transparent 50%);
  }

  /* === Clamped variant — holder clip === */
  .tube-clamped .tt-clamp {
    display: block;
  }

  .tt-clamp {
    display: none;
    position: absolute;
    left: -4px; top: 14px;
    width: 24px; height: 6px;
    border-radius: 2px;
    background:
      linear-gradient(180deg, rgba(234,234,234,0.15), transparent 40%),
      linear-gradient(180deg, #78716c, #57534e 50%, #44403c);
    border: 0.8px solid rgba(120,113,108,0.4);
    box-shadow:
      inset 0 1px rgba(255,255,255,0.12),
      0 2px 4px rgba(0,0,0,0.2);
  }

  /* Clamp screw detail */
  .tt-clamp::after {
    content: "";
    position: absolute;
    right: 2px; top: 1px;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(234,234,234,0.2), #57534e 60%);
    border: 0.5px solid rgba(0,0,0,0.2);
  }
</style>

<!-- ===== HTML: paste into world panel ===== -->
<div class="test-tube">
  <div class="tt-body">
    <div class="tt-liquid"></div>
  </div>
  <div class="tt-rim"></div>
  <div class="tt-clamp"></div>
</div>
