<!--
  K12 Asset: 电容器
  ID: capacitor
  Suitable: 电容器原理, RC电路, 交流电, 电场
  CSS Vars: --charge (0-1, controls electric field glow between plates)
  JS Hooks: set --charge in renderAt()
  Size: 30×36px at 1920×1080
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .capacitor {
    position: absolute;
    width: 30px;
    height: 36px;
    margin-left: -15px;
    margin-top: -18px;
    --charge: 0;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }

  /* Ground shadow */
  .capacitor::after {
    content: "";
    position: absolute;
    left: -2px; bottom: -6px;
    width: 34px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.28), transparent 68%);
  }

  /* Top wire lead */
  .cap-lead-top {
    position: absolute;
    left: 50%; top: 0;
    width: 2px; height: 8px;
    margin-left: -1px;
    background:
      linear-gradient(90deg, rgba(234,234,234,0.15), transparent 50%),
      linear-gradient(180deg, #94a3b8, #64748b);
    border-radius: 1px;
  }

  /* Bottom wire lead */
  .cap-lead-bot {
    position: absolute;
    left: 50%; bottom: 0;
    width: 2px; height: 8px;
    margin-left: -1px;
    background:
      linear-gradient(90deg, rgba(234,234,234,0.15), transparent 50%),
      linear-gradient(180deg, #64748b, #94a3b8);
    border-radius: 1px;
  }

  /* Top plate — metallic */
  .cap-plate-top {
    position: absolute;
    left: 5px; top: 8px;
    width: 20px; height: 4px;
    border-radius: 1px;
    background:
      linear-gradient(145deg, rgba(234,234,234,0.2), transparent 40%),
      linear-gradient(180deg, #94a3b8, #64748b 50%, #475569),
      linear-gradient(90deg, #64748b, #94a3b8 50%, #64748b);
    border: 0.5px solid rgba(100,116,139,0.5);
    box-shadow:
      inset 0 1px rgba(255,255,255,0.15),
      inset 0 -2px 3px rgba(0,0,0,0.2),
      0 2px 3px rgba(0,0,0,0.15);
  }

  /* Bottom plate — metallic */
  .cap-plate-bot {
    position: absolute;
    left: 5px; bottom: 8px;
    width: 20px; height: 4px;
    border-radius: 1px;
    background:
      linear-gradient(145deg, rgba(234,234,234,0.2), transparent 40%),
      linear-gradient(180deg, #94a3b8, #64748b 50%, #475569),
      linear-gradient(90deg, #64748b, #94a3b8 50%, #64748b);
    border: 0.5px solid rgba(100,116,139,0.5);
    box-shadow:
      inset 0 1px rgba(255,255,255,0.15),
      inset 0 -2px 3px rgba(0,0,0,0.2),
      0 2px 3px rgba(0,0,0,0.15);
  }

  /* Electric field between plates — glow */
  .cap-field {
    position: absolute;
    left: 7px; top: 12px;
    width: 16px; height: 12px;
    background:
      repeating-linear-gradient(180deg,
        rgba(96,165,250, calc(var(--charge) * 0.15)) 0px,
        transparent 1.5px, transparent 3px),
      radial-gradient(ellipse,
        rgba(59,130,246, calc(var(--charge) * 0.2)),
        transparent 70%);
    border-radius: 2px;
    pointer-events: none;
  }

  /* Charge symbol + (top plate) */
  .cap-plus {
    position: absolute;
    left: 50%; top: 6px;
    transform: translateX(-50%);
    font-family: "JetBrains Mono", monospace;
    font-size: 7px;
    font-weight: 700;
    color: rgba(239,68,68, calc(var(--charge) * 0.9));
    text-shadow: 0 0 calc(var(--charge) * 3px) rgba(239,68,68, calc(var(--charge) * 0.4));
    pointer-events: none;
  }

  /* Charge symbol - (bottom plate) */
  .cap-minus {
    position: absolute;
    left: 50%; bottom: 5px;
    transform: translateX(-50%);
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    font-weight: 700;
    color: rgba(59,130,246, calc(var(--charge) * 0.9));
    text-shadow: 0 0 calc(var(--charge) * 3px) rgba(59,130,246, calc(var(--charge) * 0.4));
    pointer-events: none;
  }
</style>

<!-- ===== HTML: paste into world panel ===== -->
<div class="capacitor">
  <div class="cap-lead-top"></div>
  <div class="cap-lead-bot"></div>
  <div class="cap-plate-top"></div>
  <div class="cap-plate-bot"></div>
  <div class="cap-field"></div>
  <div class="cap-plus">+</div>
  <div class="cap-minus">−</div>
</div>
