<!--
  K12 Asset: 飞机
  ID: airplane
  Suitable: 匀速运动, 相对运动, 速度合成, 力的分解, 升力
  CSS Vars: --paint-a (fuselage lighter), --paint-b (fuselage darker), --propeller-spin (deg)
  JS Hooks: propeller-spin for rotation; bob = Math.sin(time*2)*1
  Size: 100×36px at 1920×1080

  Variants:
    .airplane-a { --paint-a: #f1f5f9; --paint-b: #64748b; }  (white/gray, default)
    .airplane-b { --paint-a: #bfdbfe; --paint-b: #1e40af; }  (blue livery)
-->

<!-- ===== CSS: paste into <style> ===== -->
<style>
  .airplane {
    position: absolute;
    width: 100px;
    height: 36px;
    margin-left: -50px;
    transform-origin: 50% 50%;
    z-index: 12;
    --paint-a: #f1f5f9;
    --paint-b: #64748b;
    --propeller-spin: 0deg;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.3));
  }

  /* No ground shadow — airplane is an airborne standalone element */

  /* Fuselage — elongated cylindrical body */
  .airplane-fuselage {
    position: absolute;
    left: 10px;
    top: 12px;
    width: 72px;
    height: 14px;
    border-radius: 7px 3px 3px 7px;
    background:
      radial-gradient(ellipse at 30% 25%, rgba(234,234,234,0.45) 0 4px, transparent 14px),
      linear-gradient(180deg, rgba(234,234,234,0.5) 0%, transparent 30%),
      linear-gradient(180deg, transparent 65%, rgba(0,0,0,0.15) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.05), transparent 15%, transparent 85%, rgba(0,0,0,0.08)),
      linear-gradient(180deg, var(--paint-a) 0%, var(--paint-a) 45%, var(--paint-b) 100%);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.3),
      inset 0 -4px 8px rgba(0,0,0,0.2),
      inset 1px 0 2px rgba(255,255,255,0.15),
      0 3px 8px rgba(0,0,0,0.18);
  }

  /* Windows — row of portholes */
  .airplane-fuselage::before {
    content: "";
    position: absolute;
    left: 14px;
    top: 4px;
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: repeating-linear-gradient(
      90deg,
      rgba(147,197,253,0.5) 0px,
      rgba(147,197,253,0.5) 3px,
      transparent 3px,
      transparent 6px
    );
    border: 0.5px solid rgba(255,255,255,0.15);
  }

  /* Cockpit windshield — contained within fuselage */
  .airplane-fuselage::after {
    content: "";
    position: absolute;
    right: 0;
    top: 3px;
    width: 8px;
    height: 6px;
    border-radius: 1px 4px 4px 1px;
    background:
      radial-gradient(circle at 30% 30%, rgba(234,234,234,0.5), transparent 50%),
      linear-gradient(135deg, rgba(186,230,253,0.6), rgba(30,58,138,0.4));
    border: 0.5px solid rgba(255,255,255,0.25);
  }

  /* Main wing */
  .airplane-wing {
    position: absolute;
    left: 28px;
    top: 6px;
    width: 36px;
    height: 8px;
    border-radius: 2px 8px 8px 2px;
    background:
      linear-gradient(180deg, rgba(234,234,234,0.4) 0%, transparent 40%),
      linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.15) 100%),
      linear-gradient(90deg, var(--paint-b) 0%, var(--paint-a) 30%, var(--paint-a) 70%, var(--paint-b) 100%);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.3),
      inset 0 -2px 4px rgba(0,0,0,0.15),
      0 2px 6px rgba(0,0,0,0.15);
    transform-origin: 30% 50%;
  }

  /* Wing underside removed — keep element clean */

  /* Tail vertical stabilizer */
  .airplane-tail {
    position: absolute;
    left: 6px;
    top: 2px;
    width: 12px;
    height: 14px;
    clip-path: polygon(0% 100%, 30% 0%, 100% 0%, 100% 100%);
    background:
      linear-gradient(180deg, rgba(234,234,234,0.3), transparent 40%),
      linear-gradient(90deg, var(--paint-b), var(--paint-a) 60%);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
  }

  /* Tail horizontal stabilizer — contained */
  .airplane-tail::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 2px;
    width: 14px;
    height: 5px;
    border-radius: 2px 4px 4px 2px;
    background:
      linear-gradient(180deg, rgba(234,234,234,0.3), transparent 40%),
      linear-gradient(90deg, var(--paint-b), var(--paint-a));
  }

  /* Engine nacelle removed — keep airplane as clean standalone element */

  /* Nose cone */
  .airplane-nose {
    position: absolute;
    right: 4px;
    top: 14px;
    width: 10px;
    height: 10px;
    border-radius: 2px 50% 50% 2px;
    background:
      radial-gradient(circle at 60% 40%, rgba(234,234,234,0.4), transparent 50%),
      linear-gradient(90deg, var(--paint-a), rgba(148,163,184,0.8));
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
  }

  /* Color variants */
  .airplane-a { --paint-a: #f1f5f9; --paint-b: #64748b; }
  .airplane-b { --paint-a: #bfdbfe; --paint-b: #1e40af; }
  .airplane-b .airplane-fuselage {
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.3),
      inset 0 -4px 8px rgba(0,0,0,0.2),
      inset 1px 0 2px rgba(255,255,255,0.15),
      0 3px 8px rgba(30,64,175,0.25);
  }
</style>

<!-- ===== HTML: paste into world panel ===== -->
<div id="airplane" class="airplane airplane-a">
  <div class="airplane-tail"></div>
  <div class="airplane-wing"></div>
  <div class="airplane-fuselage"></div>
  <div class="airplane-nose"></div>
</div>
